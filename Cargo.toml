[workspace]
members = ["font"]

[package]
name = "libmsdf"
version = "0.6.2"
edition = "2024"
description = "wgpu SDF/MSDF render engine and typography (extracted from matter-stream)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
wgpu = "30.0.1"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
# The font half (atlases, layout tables, shaping, baking), without wgpu.
# Re-exported as `libmsdf::font` with every path unchanged. A consumer that
# lays text out from an atlas's layout tables with AtlasShaper can turn
# default features off and build neither rustybuzz nor ttf-parser.
libmsdf-font = { path = "font", default-features = false }
# Not used by the library itself: the integration tests (all behind
# `shaper`) read faces with it. Optional so a build without `shaper` has no
# ttf-parser at all.
ttf-parser = { version = "0.25", optional = true }

[features]
default = ["shaper"]
# TextShaper, StyledShaper, FontAtlasBuilder, outline extraction and the
# layout-table extraction (FaceLayout::extract): everything that reads a TTF.
# Without it, atlases are read, drawn and shaped with AtlasShaper only.
shaper = ["libmsdf-font/shaper", "dep:ttf-parser"]
# CPU msdfgen reference baking. Off by default for two reasons:
# 1. msdfgen is C++ FFI — it can never build for wasm32 (the compute-shader
#    MSDF path is the runtime generator there);
# 2. under a Cranelift dev profile on macOS, cranelift emits the C++ extern
#    references with a doubled Mach-O underscore prefix (`___ZN7msdfgen…` vs
#    the archive's `__ZN7msdfgen…`), so linking fails. A workspace on a
#    nightly Cranelift profile builds msdfgen with LLVM by adding, to its own
#    manifest (a dependency cannot set profiles):
#        [profile.dev]
#        codegen-backend = "llvm"
#    or, for a build script that bakes with libmsdf-font's `bake`:
#        [profile.dev.build-override]
#        codegen-backend = "llvm"
#    On stable Rust (which builds with LLVM) nothing is needed.
cpu-bake = ["shaper", "libmsdf-font/bake"]
# GPU integration tests (headless wgpu). Gated for the same reason: under
# the Cranelift dev profile, wgpu init aborts at runtime on aarch64
# ("llvm.aarch64.crc32b is not yet supported" — cranelift issue #171).
# Run the full GPU suite with:
#   CARGO_PROFILE_DEV_CODEGEN_BACKEND=llvm \
#     cargo test -p libmsdf --features gpu-tests,cpu-bake
gpu-tests = []
# Bundled fonts. Every one is OFF by default. The licence is in the name:
# enabling one takes on that font's licence (FONTS-LICENSE-*.txt, README.md
# "Licensing"). With none enabled, the compiled crate contains no font data
# and is MIT OR Apache-2.0 only. A face's TTF bytes also need `shaper`.
font-apache-roboto-regular = ["libmsdf-font/font-apache-roboto-regular"]
font-apache-roboto-bold = ["libmsdf-font/font-apache-roboto-bold"]
font-apache-roboto-italic = ["libmsdf-font/font-apache-roboto-italic"]
font-apache-roboto-msymbols = ["libmsdf-font/font-apache-roboto-msymbols"]
font-ofl-grenze-gotisch = ["libmsdf-font/font-ofl-grenze-gotisch"]
font-ofl-texturina = ["libmsdf-font/font-ofl-texturina"]
# The terminal face: Noto Sans Mono Regular and Bold, one two-layer atlas
# (docs/design/20261023_01_TERMINAL_FONTS_PLAN.md).
font-ofl-noto-sans-mono = ["libmsdf-font/font-ofl-noto-sans-mono"]
# The terminal symbol page: box drawing, blocks, Braille, geometric shapes,
# curated symbols and monochrome emoji, merged from Noto faces.
font-ofl-noto-terminal-symbols = ["libmsdf-font/font-ofl-noto-terminal-symbols"]
fonts-apache-roboto = [
    "font-apache-roboto-regular",
    "font-apache-roboto-bold",
    "font-apache-roboto-italic",
    "font-apache-roboto-msymbols",
]
fonts-ofl-ledger = ["font-ofl-grenze-gotisch", "font-ofl-texturina"]
# The terminal preset: Noto Sans Mono text and the symbol page
# (docs/design/20261023_01_TERMINAL_FONTS_PLAN.md).
fonts-ofl-terminal = ["font-ofl-noto-sans-mono", "font-ofl-noto-terminal-symbols"]

[[example]]
name = "bake_atlas"
required-features = ["cpu-bake"]

[build-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[dev-dependencies]
pollster = "0.4"
png = "0.17"
